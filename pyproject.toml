[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "specpilot"
version = "1.0.0"
description = "Codebase-aware Spec-Driven Development for the AI SDLC: skills, gates, generated regression tests and a guarded pentest step."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []  # the CLI is standard-library only

[project.optional-dependencies]
e2e = ["pytest>=8", "pytest-playwright>=0.5"]
dev = ["pytest>=8", "ruff", "bandit", "pip-audit"]

[project.scripts]
sdd = "specpilot.cli:main"
specpilot = "specpilot.cli:main"

[tool.setuptools.packages.find]
include = ["specpilot*"]

[tool.setuptools.package-data]
specpilot = ["assets/**/*"]

[tool.ruff]
line-length = 120

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B404", "B603"]  # subprocess is used deliberately: argument lists, shell=False, validated input
