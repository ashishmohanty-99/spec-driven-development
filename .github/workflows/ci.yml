name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -W error::ResourceWarning -m unittest -v
      - run: pip install . && sdd --version && sdd --dir "$(mktemp -d)" init
      - run: python tools/build_skill.py
      - run: python tools/build_plugin.py --check
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.13'
        with:
          name: sdd-skill
          path: dist/sdd-skill.zip

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff bandit .
      - run: ruff check .
      - run: bandit -r skills/spec-driven-development-by-ashish-mohanty/scripts/specpilot -c pyproject.toml
      - run: sdd audit
      - run: sdd security --no-history
